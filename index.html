  <style>
    :root{
      --bg:#FFFFFF; --panel:#FFFFFF; --card:#FFFFFF;
      --ink:#3A2415; --muted:#6E4F3D; --line:#E3C8A6;
      --accent:#C9923A; --accent-ink:#2A1A0E; --accent-soft:#F2D49B;
      --headerH: 300px;
      --logo-max-width: 880px;
      --focus: 2px solid #2A1A0E;
      --fadeW: 26px; /* ancho del fade lateral del menú */
    }

    *{box-sizing:border-box;margin:0;padding:0}
    img{max-width:100%;display:block;height:auto}
    html{
      scroll-behavior:smooth;
      color-scheme: light !important;
      scroll-padding-top: calc(var(--headerH) + 12px);
    }
    :target{scroll-margin-top: calc(var(--headerH) + 12px)}

    body{
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      line-height:1.6; background:#FFFFFF;
    }
    a{color:var(--accent)}
    .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

    /* ===== Accesibilidad ===== */
    .skip-link{
      position:absolute; left:8px; top:-40px; z-index:9999;
      background:#fff; border:1px solid var(--line); padding:8px 10px; border-radius:10px;
      transition: top .15s ease; box-shadow:0 6px 20px rgba(0,0,0,.06);
    }
    .skip-link:focus{ top:8px; outline: var(--focus) }
    :focus-visible{ outline: var(--focus); outline-offset: 2px }

    /* ===== HEADER: logo + menú (fijos) ===== */
    header.site{
      position:sticky; top:0; z-index:10; background:#FFFFFF;
      backdrop-filter:saturate(120%) blur(8px);
    }
    .header-stack{
      display:flex; flex-direction:column; align-items:center;
      gap:0; padding-top:2px; padding-bottom:0;
    }

    /* Contenedor del logo */
    .brand-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:0;
      overflow:hidden;
      height:180px;
    }
    @media (min-width:600px){ .brand-wrap{ height:200px } }
    @media (min-width:1024px){ .brand-wrap{ height:220px } }

    /* Imagen del logo (centrado, sin recortes agresivos) */
    .brand-lockup{
      height:100%;
      max-width:min(var(--logo-max-width), 95vw);
      object-fit:contain;
      margin-inline:auto;
      clip-path:none;
      image-rendering:auto;
    }

    /* Menú */
    .top-nav{
      width:100%;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:#FFFFFF;
    }
    .top-nav .wrap{ padding-left:8px; padding-right:8px; }
    .top-nav .links{
      position:relative;
      display:flex; align-items:center; justify-content:flex-start;
      gap:8px; padding:6px 8px;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; scroll-snap-type:x proximity;
      -webkit-mask-image: linear-gradient(to right, transparent, black var(--fadeW), black calc(100% - var(--fadeW)), transparent);
              mask-image: linear-gradient(to right, transparent, black var(--fadeW), black calc(100% - var(--fadeW)), transparent);
    }
    .top-nav .links::-webkit-scrollbar{ display:none }
    .top-nav .links a{
      color:var(--muted); text-decoration:none;
      font-size:clamp(13px, 2.9vw, 15px);
      padding:6px 8px; border-radius:8px; white-space:nowrap;
      scroll-snap-align:start;
    }
    .top-nav .links a:hover{ background:#fff7ec }
    .top-nav .links a[aria-current="true"]{
      color:var(--ink); box-shadow:0 0 0 1px var(--line) inset;
    }

    /* ===== Equipo: tipografías y subtítulos (MODIFICADO) ===== */
    #equipo h3{
      font-family:inherit; /* <<< CAMBIO AQUÍ: Usa la fuente del body (Inter) */
      font-weight:700;
      line-height:1.25;
      letter-spacing:.2px;
      margin-bottom:6px;
    }
    #equipo h4.discreet{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-weight:700;       /* negrita */
      text-transform:none;   /* sin MAYÚSCULAS forzadas */
      letter-spacing:0;
      font-size:14px;        /* 13px si los quieres más discretos */
      color:#3A2415;
      margin:8px 0 4px;
    }

    /* ===== HERO (MODIFICADO) ===== */
    .hero{
      position:relative;
      min-height:52vh;
      display:grid; place-items:center; text-align:left; overflow:hidden;
      padding:4px 0 24px;
    }
    .hero .inner{
      position:relative; z-index:1; max-width:980px; padding:20px 18px;
      background:#FFFFFF; border:1px solid rgba(227,200,166,.85);
      border-radius:16px; box-shadow:0 24px 60px rgba(58,36,21,.14);
      display:grid; gap:18px;
    }
    @media (min-width:900px){
      .hero .inner{grid-template-columns:1fr 1fr; align-items:center}
    }

    .headline > h1{
      font-family:inherit; /* <<< CAMBIO AQUÍ: Usa la fuente del body (Inter) */
      font-weight:700;
      font-size:clamp(28px,4.2vw,48px);
      line-height:1.08; margin:2px 0 8px;
      letter-spacing:.2px;
    }
    .sub{font-size:clamp(15px,2.2vw,18px);color:var(--muted);margin-bottom:14px}
    .cta-row{display:flex;gap:10px;flex-wrap:wrap}
    .cta{
      display:inline-flex;gap:10px;align-items:center;justify-content:center;
      background:linear-gradient(180deg,var(--accent-soft),var(--accent));
      color:var(--accent-ink);font-weight:700;text-decoration:none;
      padding:12px 16px;border-radius:12px;border:1px solid rgba(201,146,58,.55);
      box-shadow:0 6px 16px rgba(58,36,21,.18);transition:.18s ease
    }
    .cta:hover{transform:translateY(-1px);filter:brightness(1.03)}
    .cta.ghost{background:#FFF;color:var(--ink);box-shadow:none}

    /* Cinta aviso en HERO */
    .hero-note{
      background:#FFF;border:1px solid var(--line);border-radius:10px;
      padding:10px 12px;margin-top:6px;display:inline-block
    }

    /* Foto secundaria */
    .photo-chip{justify-self:center}
    .photo-chip img{
      width:min(100%, 720px); height:auto;
      border-radius:16px;border:1px solid var(--line);
      box-shadow:0 12px 28px rgba(58,36,21,.12);
      margin:0 auto; aspect-ratio:4/3;
    }
    .photo-chip figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

    /* SECCIONES (MODIFICADO) */
    main section{padding:44px 0;border-top:1px solid var(--line)}
    h2{
      font-family:inherit; /* <<< CAMBIO AQUÍ: Usa la fuente del body (Inter) */
      font-weight:700;
      font-size:clamp(24px,3.6vw,34px);margin:0 0 12px;position:relative;padding-bottom:6px;
      display:flex;align-items:center;gap:.5rem;
    }
    h2::after{
      content:"";position:absolute;left:0;bottom:0;width:84px;height:2px;border-radius:2px;
      background:linear-gradient(90deg,var(--accent),rgba(201,146,58,0))
    }
    main h2::before{
      content:"";width:32px;height:32px;flex:0 0 32px;
      background:center/contain no-repeat url("logo-symbol-256.png");
      transform:translateY(1px);
    }

    .lead{color:var(--muted);margin:0 0 16px}
    .kicker{color:#5a3b21;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-bottom:6px;opacity:.85}

    /* Tarjetas */
    .cards{display:grid;gap:14px}
    @media (min-width:860px){ .cards{grid-template-columns:repeat(3,1fr)} }
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
    .card h3{margin-bottom:6px}
    .mini-list{list-style:none;padding-left:0;margin:8px 0 0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
    .mini-list li strong{color:var(--ink)}
    .ul-bulleted{ list-style:disc; padding-left:1.2rem; margin:8px 0 0 }
    .ul-bulleted li{ margin-bottom:8px }

    /* EQUIPO extras */
    .team-grid{display:grid;gap:16px}
    @media (min-width:860px){ .team-grid{grid-template-columns:repeat(2,1fr)} }
    .team-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;background:#FFF;border:1px solid var(--line);border-radius:14px;padding:14px}
    .team-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
    .tag{display:inline-block;font-size:12px;line-height:1;padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);margin-right:6px;margin-top:4px}

    /* Testimonios */
    .section-testimonials{padding:48px 0;border-top:1px solid var(--line);background:var(--panel)}
    .ts-wrap{max-width:1120px;margin:0 auto;padding:0 20px}
    .ts-grid{display:grid;gap:16px}

    .ts-card{

    .ts-name{font-weight:700}
    .ts-role{color:var(--muted);margin-left:.35rem}
    .ts-stars{color:var(--accent);letter-spacing:.08em;margin:2px 0 6px}
