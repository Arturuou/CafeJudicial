    /* ================================================= */
    /* 1. VARIABLES Y CONFIGURACIÓN GENERAL */
    /* ================================================= */
    :root{
      /* Paleta de colores de Café Judicial */
      --bg:#FFFFFF;
      --panel:#F9F6F2; /* Un blanco hueso para paneles */
      --ink:#3A2415;
      --ink-light: #FFFFFF; /* Texto sobre fondos oscuros */
      --muted:#6E4F3D;
      --line:#E3C8A6;
      --accent:#C9923A;
      --accent-ink:#2A1A0E;
      --accent-soft:#F2D49B;

      --headerH: 70px; /* Nueva altura de header fijo */
      --focus: 2px solid var(--accent);
      --radius-med: 12px;
      --radius-sml: 8px;
      --shadow-med: 0 10px 30px rgba(58, 36, 21, 0.1);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html{
      scroll-behavior:smooth;
      scroll-padding-top: var(--headerH);
    }
    :target{ scroll-margin-top: var(--headerH); }

    body{
      color:var(--ink);
      font-family:'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.6; 
      background:var(--bg);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    img{max-width:100%;display:block;height:auto}
    a{color:var(--accent); text-decoration: none;}
    a:hover{ text-decoration: underline; }

    /* Tipografía de la referencia */
    h1, h2, h3 {
      font-family:'Playfair Display', serif;
      font-weight:700;
      line-height:1.2;
      letter-spacing: 0.2px;
      margin-bottom: 0.5em;
    }
    h1{ font-size: clamp(2.5rem, 5vw, 3.5rem); }
    h2{ font-size: clamp(2rem, 4vw, 2.75rem); }
    h3{ font-size: clamp(1.25rem, 2vw, 1.5rem); }

    /* Contenedor principal */
    .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

    /* Estructura de secciones */

      padding: clamp(3rem, 6vw, 5rem) 0;
    }
    main section:nth-of-type(even){

    }
    .section-title{
      text-align: center;
      max-width: 650px;
      margin: 0 auto 2.5rem;
    }
    .kicker{

      text-transform:uppercase;
      font-size:12px;
      font-weight: 700;
      margin-bottom:6px;
    }
    .lead{
      font-size: 1.125rem;
      color:var(--muted);
      margin-bottom: 1rem;
    }
    .section-title .lead {
      color: var(--muted);
      font-size: 1.125rem;
    }
    .section-title h2::after{ display: none; } /* Quitamos el ::before y ::after de los H2 */
    main h2::before{ display: none; }

    /* ================================================= */
    .site-header{

      height: var(--headerH);
    }

    }

      font-size: 14px;

      transition: color .15s ease;
    }

      border-radius: var(--radius-sml);

      font-size: 14px;
    }

      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .mobile-nav-toggle{

      color: var(--ink);
      cursor: pointer;

    }

      margin: 0 auto 1.5rem;
    }
